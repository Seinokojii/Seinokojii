<svg xmlns="http://www.w3.org/2000/svg" width="860" height="414" viewBox="0 0 860 414" role="img"><rect x="0.5" y="0.5" width="859" height="413" rx="8" fill="#1F2933" stroke="#2C3644"/><text x="64" y="62" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="15" letter-spacing="2.4" fill="#8A93A0">WHAT THE CHARTS DID NOT SHOW</text><text x="64" y="96" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#8A93A0">Two defects found while building the dashboard.</text><rect x="64" y="108" width="4" height="96" rx="2" fill="#84A8CD"/><text x="86" y="132" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="23" font-weight="400" fill="#C2BEC3">Retention that grows</text><text x="86" y="158" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="15" letter-spacing="1.2" fill="#84A8CD">11 → 32 → 51 → 71 users in one cohort</text><text x="86" y="184" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" fill="#8A93A0">subscription start_date was generated independently of signup_date, so</text><text x="86" y="206" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" fill="#8A93A0">cohort metrics could not be computed at all; the dashboard says so instead</text><text x="86" y="228" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" fill="#8A93A0">of drawing a curve that would look fine and mean nothing</text><rect x="64" y="246" width="4" height="96" rx="2" fill="#6B93BC"/><text x="86" y="270" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="23" font-weight="400" fill="#C2BEC3">A cohort model stuck at month zero</text><text x="86" y="296" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="15" letter-spacing="1.2" fill="#84A8CD">every cohort: one row, 100 %</text><text x="86" y="322" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" fill="#8A93A0">month_num was measured from the subscription's own start_date, and a</text><text x="86" y="344" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" fill="#8A93A0">not_null test passed the whole time; rewritten as a survival curve, guarded</text><text x="86" y="366" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" fill="#8A93A0">by a test that fails if retention ever rises</text></svg>