<svg xmlns="http://www.w3.org/2000/svg" width="860" height="478" viewBox="0 0 860 478" role="img"><rect x="0.5" y="0.5" width="859" height="477" rx="8" fill="#1F2933" stroke="#2C3644"/><text x="64" y="62" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="15" letter-spacing="2.4" fill="#8A93A0">HOW THE DATA IS CHECKED</text><text x="64" y="96" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#8A93A0">Four layers, each catching what the others miss.</text><rect x="64" y="134" width="4" height="42" rx="2" fill="#33465A"/><text x="86" y="160" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#C2BEC3">Is this row valid?</text><text x="86" y="184" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="15" letter-spacing="1.2" fill="#8A93A0">DBT CORE TESTS<tspan fill="#2C3644">  ·  </tspan>unique, not_null, accepted_values</text><rect x="64" y="212" width="4" height="42" rx="2" fill="#4A6D8F"/><text x="86" y="238" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#C2BEC3">Is this value plausible?</text><text x="86" y="262" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="15" letter-spacing="1.2" fill="#8A93A0">DBT-EXPECTATIONS<tspan fill="#2C3644">  ·  </tspan>row counts, payload size in range</text><rect x="64" y="290" width="4" height="42" rx="2" fill="#6B93BC"/><text x="86" y="316" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#C2BEC3">Does today look like yesterday?</text><text x="86" y="340" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="15" letter-spacing="1.2" fill="#8A93A0">ELEMENTARY<tspan fill="#2C3644">  ·  </tspan>volume drops, mean shift, null spikes</text><rect x="64" y="368" width="4" height="42" rx="2" fill="#84A8CD"/><text x="86" y="394" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#C2BEC3">Should downstream run at all?</text><text x="86" y="418" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="15" letter-spacing="1.2" fill="#8A93A0">DAGSTER ASSET CHECKS<tspan fill="#2C3644">  ·  </tspan>raw not empty, source fresh</text></svg>